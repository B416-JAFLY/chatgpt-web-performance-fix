name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun test
      - run: bun run build
      - run: bun run test:rich-browser
      - run: bun run test:browser
      - run: bun run analyze:validation
      - run: bun run benchmark
      - run: bun run benchmark:browser
